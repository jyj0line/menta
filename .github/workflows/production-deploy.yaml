name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────
  # Job 1: production supabase migration
  # ─────────────────────────────────────────────────────
  production-supabase-migration:
    name: production supabase migration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: production-supabase-check
    if: |
      (github.event_name == 'push' && github.ref_name == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    environment: menta-production-supabase-environment
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      # ── Setup CI environment ───────────────────────────────────────
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6

      - name: supabase setup cli
        uses: supabase/setup-cli@df56b21da46c98abb12a9804e4fb1f657773e333 #v2

      # ── Remote Develop DB Migration ───────────────────────────
      - name: link supabase remote production project
        run: npm run supabase:link

      - name: production db migration
        run: npm run supabase:push

  # ─────────────────────────────────────────
  # Job 2: production vercel deploy
  # ─────────────────────────────────────────
  production-vercel-deploy:
    name: production vercel deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: production-supabase-migration
    if: |
      (github.event_name == 'push' && github.ref_name == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    environment: menta-vercel-environment
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      # ── Setup CI environment ───────────────────────────────────────
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6

      - name: install vercel cli
        run: npm install --global vercel@53.1.0

      - name: pull vercel production environment information
        run: vercel pull --yes --environment=production

      - name: build project artifacts
        run: vercel build --target=production --prod

      - name: deploy project artifacts to vercel
        run: vercel deploy --prebuilt --prod