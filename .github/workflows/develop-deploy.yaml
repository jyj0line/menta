name: Develop Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────
  # Job 1: develop supabase migration
  # ─────────────────────────────────────────────────────
  develop-supabase-migration:
    name: develop supabase migration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.event_name == 'push' && github.ref_name == 'develop')
      || (github.event_name == 'workflow_dispatch' && github.ref_name == 'develop')
    environment: menta-develop-supabase-environment
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      # ── Setup CI environment ───────────────────────────────────────
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6

      - name: supabase setup cli
      - uses: supabase/setup-cli@df56b21da46c98abb12a9804e4fb1f657773e333 #v2

      # ── Remote Develop DB Migration ───────────────────────────
      - name: link supabase remote develop project
        run: npm run supabase:link

      - name: develop db migration
        run: npm run supabase:push

  # ─────────────────────────────────────────
  # Job 2: develop vercel deploy
  # ─────────────────────────────────────────
  develop-vercel-deploy:
    name: develop vercel deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: develop-supabase-migration
    if: |
      (github.event_name == 'push' && github.ref_name == 'develop')
      || (github.event_name == 'workflow_dispatch' && github.ref_name == 'develop')
    environment: menta-vercel-environment
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      # ── Setup CI environment ───────────────────────────────────────
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6

      - name: install vercel cli
        run: npm install --global vercel@53.1.0

      - name: pull vercel preview environment information
        run: vercel pull --yes --environment=preview --git-branch=develop

      - name: build project artifacts
        run: vercel build --target=preview

      - name: deploy project artifacts to vercel
        run: vercel deploy --prebuilt