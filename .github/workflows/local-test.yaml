name: Test

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────
  # Job 1: eslint i18ncheck test
  # ─────────────────────────────────────────────────────
  eslint-i18ncheck-test:
    name: eslint i18ncheck test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # ── Setup CI environment  ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6

      - name: Setup and Cache Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f #v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── ESLint Test ──────────────────────────────────────
      - name: ESLint Test
        run: npm run eslint

      # ── i18n-check Test ──────────────────────────────────────
      - name: i18n-check Test
        run: npm run i18ncheck

  # ─────────────────────────────────────────────────────
  # Job 2: unit integration test(vitest/rtl)
  # ─────────────────────────────────────────────────────
  unit-integration-test:
    name: unit integration test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: eslint-i18ncheck-test
    steps:
      # ── Setup CI environment  ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6

      - name: Setup and Cache Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f #v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Setup Supabase Local DB ──────────────────────────────────────
      - name: Start DB
        run: npm run supabase:start

      - name: Reset DB (apply migrations + seed)
        run: npm run supabase:reset

      # ── Unit & Integration Test (Vitest + RTL) ──────────────────────────────────────
      - name: Run Vitest
        run: npm run vitest--cvr

      - name: Upload Vitest report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        with:
          name: vitest-report
          path: vitest-report/
          retention-days: 30

  # ─────────────────────────────────────────────────────
  # Job 3: local supabase check(local db lint, test, type-check)
  # ─────────────────────────────────────────────────────
  local-supabase-check:
    name: local supabase check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: unit-integration-test

    steps:
      # ── Setup CI environment ───────────────────────────────────────
      - name: checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6

      - name: supabase setup cli
        uses: supabase/setup-cli@df56b21da46c98abb12a9804e4fb1f657773e333 #v2

      # ── Local DB Validation ─────────────────────────────────
      - name: start local DB
        run: npm run supabase:dbstart

      - name: lint DB
        run: npm run supabase:lint

      - name: test DB
        run: npm run supabase:test

      - name: verify generated types are checked in
        run: |
          npm run supabase:type
          if ! git diff --ignore-space-at-eol --exit-code --quiet libs/supabase/supabase.type.ts; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            exit 1
          fi

  # ─────────────────────────────────────────────────────
  # Job 4: local e2e test(playwright)
  # ─────────────────────────────────────────────────────
  local-e2e-test:
    name: local e2e test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: local-supabase-check
    environment: menta-local-nextjs-environment
    env:
      NEXT_PUBLIC_NEXTJS_ORIGIN: ${{ secrets.NEXT_PUBLIC_NEXTJS_ORIGIN }}
      NEXT_PUBLIC_SUPABASE_AK_PUBLISHABLE: ${{ secrets.NEXT_PUBLIC_SUPABASE_AK_PUBLISHABLE }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      PLAYWRIGHT_TEST_DIR: ${{ secrets.PLAYWRIGHT_TEST_DIR }}

    steps:
      # ── Setup CI environment  ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6

      - name: Setup and Cache Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f #v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Setup Supabase Local Stack ──────────────────────────────────────
      - name: Start Supabase
        run: npm run supabase:start

      - name: Reset DB (apply migrations + seed)
        run: npm run supabase:reset

      # ── Setup Next.js ──────────────────────────────────────
      - name: Cache Next.js build
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 #v5
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build Next.js
        run: npm run build--tp

      - name: Start Next.js
        run: npm run start &

      - name: Wait for Next.js
        run: npm run playwright:wait

      # ── E2E Tests (Playwright) ──────────────────────────────────────
      - name: Install Playwright Browsers
        run: npm run playwright:deps

      - name: Run Playwright tests
        run: npm run playwright

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30